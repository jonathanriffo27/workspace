<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="description" content="Workspace Personal - Tu espacio de productividad" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F0F0F'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%23F59E0B'%3EW%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <title>Workspace Personal</title>
    <link rel="stylesheet" href="src/styles/main.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="header-title">Workspace</h1>
        <span class="header-subtitle">Personal</span>
      </header>

      <main class="content">
        <section id="compras-section" class="section active">
          <div class="stats-bar">
            <div class="skeleton-stat"></div>
            <div class="skeleton-stat"></div>
            <div class="skeleton-stat"></div>
          </div>
          <div class="input-wrapper">
            <div class="skeleton-input"></div>
          </div>
          <div class="items-list">
            <div class="item-card skeleton-card">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-content">
                <div class="skeleton-text"></div>
                <div class="skeleton-badge"></div>
              </div>
            </div>
            <div class="item-card skeleton-card">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-content">
                <div class="skeleton-text"></div>
                <div class="skeleton-badge"></div>
              </div>
            </div>
            <div class="item-card skeleton-card">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-content">
                <div class="skeleton-text"></div>
                <div class="skeleton-badge"></div>
              </div>
            </div>
            <div class="item-card skeleton-card">
              <div class="skeleton-checkbox"></div>
              <div class="skeleton-content">
                <div class="skeleton-text"></div>
                <div class="skeleton-badge"></div>
              </div>
            </div>
          </div>
        </section>
        <section id="ideas-section" class="section"></section>
        <section id="tareas-section" class="section"></section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="compras">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Compras</span>
        </button>
        <button class="nav-item" data-tab="ideas">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 008 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5M9 18h6M10 22h4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Ideas</span>
        </button>
        <button class="nav-item" data-tab="tareas">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Tareas</span>
        </button>
      </nav>

      <div class="toast-container" id="toast-container"></div>

      <div id="voice-overlay" class="voice-overlay">
        <div class="pixel-glow"></div>
        <div class="voice-content">
          <div class="voice-status">Escuchando...</div>
          <div class="voice-transcript" id="voice-transcript">Habla ahora...</div>
          <div class="voice-waves">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
